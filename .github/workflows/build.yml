name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать project.zip (если он есть в репозитории)
        run: |
          if [ -f project.zip ]; then
            unzip -oq project.zip
            echo "project.zip распакован"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MirrorKeys-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorKeys-apk
          path: MirrorKeys-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MirrorKeys build ${{ github.run_number }}
          files: MirrorKeys-${{ github.run_number }}.apk
